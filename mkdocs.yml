site_name: 复旦大学 计算机系统基础（2026年秋季学期）
site_url: https://ics-26fall-fdu.github.io
repo_name: ICS-26Fall-FDU.github.io
repo_url: https://github.com/ICS-26Fall-FDU/ICS-26Fall-FDU.github.io

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  language: zh
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs 
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate 
    - content.code.copy
  icon:
    annotation: material/help-circle

plugins:
  - meta: 
      enabled: true
  - search
  - git-committers:
      repository: ICS-26Fall-FDU/ICS-26Fall-FDU.github.io
      branch: main

markdown_extensions:
  - admonition
  - pymdownx.details 
  - pymdownx.superfences
  - attr_list 
  - md_in_html

nav: 
  - 首页: index.md
  - 实验: 
    - 总览: labs/index.md
#    - 测试: labs/test-lab.md
