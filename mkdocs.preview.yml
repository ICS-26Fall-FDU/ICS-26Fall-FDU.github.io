INHERIT: mkdocs.yml

site_name: 复旦大学 计算机系统基础（2026年秋季学期）· 预览
site_url: https://weijiansh1.github.io/ICS-26Fall-FDU.github.io/
repo_name: weijiansh1/ICS-26Fall-FDU.github.io
repo_url: https://github.com/weijiansh1/ICS-26Fall-FDU.github.io

extra:
  preview: true

plugins:
  - meta:
      enabled: true
  - search:
      separator: '[\s\u200b\-]'
  - git-committers:
      repository: weijiansh1/ICS-26Fall-FDU.github.io
      branch: preview
      exclude:
        - team.md
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      exclude:
        - team.md
